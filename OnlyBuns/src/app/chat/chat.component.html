<div class="chat-container">
  <strong class="title">

    <strong (click)="goToProfile(chat?.name || '',chat?.type||'')" matTooltip="Show profile">{{ chat?.name
      }} </strong>
    <img src="assets/add-participants.png" *ngIf="chat?.adminUsername==currentUsername && chat?.type=='GROUP'"
      alt="participants" matTooltip="Add participants" (click)="changeAddShowingParticipants()"
      style="width: 30px;height: 30px;margin-left: 30px;">
    <img src="assets/show-participants.png" *ngIf="chat?.type=='GROUP'" alt="participants"
      matTooltip="Show participants" (click)="changeShowingParticipants()"
      style="width: 30px;height: 30px;margin-left: 30px;">
  </strong>

  <div class="chat-messages" #chatMessages (scroll)="onScroll()">
    <div *ngFor="let group of groupedMessages" class="chat-messages-child">
      <!-- Prikaz datuma -->
      <div class="date-separator">{{ group.date }}</div>
      <!-- Prikaz poruka za taj datum -->
      <div *ngFor="let message of group.messages" class="message"
        [class.sent]="message.sender.username === currentUsername"
        [class.received]="message.sender.username !== currentUsername">
        <strong class="sender">{{ message.sender.username }}</strong>
        <p class="content" [innerHTML]="convertEmojis(message.content)"></p>
        <span class="timestamp">{{ message.timestamp | date: 'shortTime' }}</span>
      </div>
    </div>
  </div>

  <!-- Dugme za skrolovanje na dno -->
  <button class="scroll-to-bottom" *ngIf="!isAtBottom" (click)="scrollToBottom()" matTooltip="Scroll to bottom">
    ⬇️
  </button>

  <div class="input-container" (keyup.enter)="sendMessage()">
    <div class="messageBox">
      <div class="emoji-picker">
        <button matTooltip="Add emoji" style="border-radius: 0px;border: none;font-size: x-large;"
          (click)="toggleEmojiPicker()">😀</button>
        <div *ngIf="showEmojiPicker" class="emoji-list">
          <span *ngFor="let emoji of emojis" (click)="addEmoji(emoji)">{{ emoji }}</span>
        </div>
      </div>
      <input required="" [(ngModel)]="messageContent" placeholder="Enter your message..." type="text"
        id="messageInput" />
      <button id="sendButton" matTooltip="Send message" (click)="sendMessage()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 664 663">
          <path fill="none"
            d="M646.293 331.888L17.7538 17.6187L155.245 331.888M646.293 331.888L17.753 646.157L155.245 331.888M646.293 331.888L318.735 330.228L155.245 331.888">
          </path>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="33.67" stroke="#6c6c6c"
            d="M646.293 331.888L17.7538 17.6187L155.245 331.888M646.293 331.888L17.753 646.157L155.245 331.888M646.293 331.888L318.735 330.228L155.245 331.888">
          </path>
        </svg>
      </button>
    </div>

    <!-- <input class="chat-input" type="text" [(ngModel)]="messageContent" placeholder="Enter your message..."
      (keyup.enter)="sendMessage()" />
    <button class="send-button" matTooltip="Send message" (click)="sendMessage()">Send</button> -->
  </div>
</div>

<!-- dodavanje novog korisnika u chat -->
<div *ngIf="showAddParticipants" class="new-chat" style="padding-top: 10px;" class="new-chat">
  <span class="return" style="font-size: 40px;margin: 0px;margin-bottom: 20px;margin-left: auto;"
    matTooltip="Close window" (click)="changeAddShowingParticipants()">
    &times;
  </span>
  <h1 style="color: white;">Add user to chat</h1>
  <div class="user-search" style="margin: 0px;margin-top: 20px;">
    <div style="display: flex;flex-direction: row;">
      <div class="inputGroup">
        <input type="text" required="" [(ngModel)]="searchQuery" (input)="searchUsers(searchQuery)" autocomplete="off">
        <label for="name">Search users</label>
      </div>
      <span class="return" matTooltip="clear search" (click)="ClearSearch()">
        <mat-icon>clear</mat-icon>
      </span>
    </div>
    <div class="search-results" *ngIf="searchResults.length > 0">
      <div class="search-item" *ngFor="let user of searchResults">
        <div style="display: flex;flex-direction: row;justify-content: space-between;width: 100%;">
          <span>{{ user.username }}</span>
          <div *ngIf="chat?.adminUsername==currentUsername" (click)="addUserToChat(user.id)" matTooltip="Add to chat"
            tabindex="0" class="plusButton">
            <svg class="plusIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
              <g mask="url(#mask0_21_345)">
                <path d="M13.75 23.75V16.25H6.25V13.75H13.75V6.25H16.25V13.75H23.75V16.25H16.25V23.75H13.75Z"></path>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- prikaz korisnika u chatu -->
<div *ngIf="showParticipants" class="new-chat" style="padding-top: 10px;" class="new-chat">
  <span class="return" style="font-size: 40px;margin: 0px;margin-bottom: 20px;margin-left: auto;"
    matTooltip="Close window" (click)="changeShowingParticipants()">
    &times;

          </button>
          <img src="assets/admin.png" *ngIf="chat?.adminUsername==user.username" style="width: 30px;height: 30px;"
