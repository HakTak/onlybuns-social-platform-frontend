<mat-card elevation="5" fxFlex class="content">
    <mat-card-title>
      <h2>{{title}}</h2>
    </mat-card-title>
  
    <mat-card-content>
      <p *ngIf="notification" [class]="notification.msgType">{{notification.msgBody}}</p>
      
      <form (ngSubmit)="onSubmit()" *ngIf="!submitted" [formGroup]="form">
        <mat-form-field>
          <label>Username:</label>
          <input formControlName="username" matInput required>
          <mat-error *ngIf="form.get('username')?.hasError('required')">Username is required</mat-error>
          <mat-error *ngIf="form.get('username')?.hasError('minlength')">Minimum length is 3 characters</mat-error>
        </mat-form-field>


        <mat-form-field>
          <label>Address:</label>
          <input formControlName="address" matInput>
        </mat-form-field>
  
        <mat-form-field>
          <label>Email:</label>
          <input formControlName="email" matInput required>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email format</mat-error>
        </mat-form-field>
  
        <mat-form-field>
          <label>Password:</label>
          <input formControlName="password" matInput required type="password">
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Minimum length is 8 characters</mat-error>
        </mat-form-field>
  
        <mat-form-field>
          <label>Confirm Password:</label>
          <input formControlName="confirmPassword" matInput required type="password">
          <mat-error *ngIf="form.hasError('mismatch')">Passwords do not match</mat-error>
        </mat-form-field>


  
        <mat-form-field>
          <label>First Name:</label>
          <input formControlName="firstname" matInput>
        </mat-form-field>
  
        <mat-form-field>
          <label>Last Name:</label>
          <input formControlName="lastname" matInput>
        </mat-form-field>
  
        
  
        <button [disabled]="!form.valid" color="primary" mat-raised-button type="submit">Sign up</button>
        <br>
        <button color="primary" mat-raised-button routerLink="/">Go Back</button>
      </form>
      
      <br>
      <mat-spinner *ngIf="submitted" mode="indeterminate"></mat-spinner>
      <br>
      <hr>
    </mat-card-content>
  </mat-card>
