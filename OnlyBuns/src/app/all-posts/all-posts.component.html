<div *ngIf="posts.length > 0; else noPostsTemplate">
    <div class="post-list">
      <mat-card *ngFor="let post of posts" class="post-card"
                (mouseover)="onMouseOver(post)" (mouseout)="onMouseOut(post)">
        <mat-card-header>
          <mat-card-title (click)="goToProfile(post.authorUsername)" class="clickable">
            {{ post.authorUsername }}
          </mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <img mat-card-image [src]="post.imagePath" alt="Post image">
        </mat-card-content>
        <mat-card-footer>
          <mat-card-content>
            <p>{{ post.description }}</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button>{{ post.likes }} Likes</button>
            <button mat-button (click)="viewComments(post)">Comments</button>
          </mat-card-actions>
        </mat-card-footer>
      </mat-card>
    </div>
    <div class="pagination">
      <button class="dugme" mat-button (click)="previousPage()" [disabled]="currentPage === 0">Previous</button>
      <button class="dugme" mat-button (click)="nextPage()">Next</button>
    </div>
  </div>
  <ng-template #noPostsTemplate>
    <div class="no-posts-message">There are no posts</div>
  </ng-template>
