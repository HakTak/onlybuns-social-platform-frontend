<div class="profile-map-container">
    <!-- Search Field -->
    <div class="search-container">
      <mat-form-field class="full-width">
        <mat-label>Search Location</mat-label>
        <input matInput [(ngModel)]="searchQuery" placeholder="Enter location" />
        <button mat-icon-button matSuffix type="button" (click)="onSearch()">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    </div>
  
    <!-- Map Component -->
    <app-map
      [longitude]="userLocation.longitude"
      [latitude]="userLocation.latitude"
      (setLocation)="setLocation($event)"
      class="map-container"
    >
    </app-map>
  </div>
